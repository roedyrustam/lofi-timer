<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background (Retro Pink) -->
  <rect width="1024" height="1024" fill="#ffb7b2" rx="200" />
  
  <!-- Outer border -->
  <rect x="32" y="32" width="960" height="960" fill="none" stroke="#2d2d2d" stroke-width="40" rx="168" />
  <rect x="48" y="48" width="960" height="960" fill="none" stroke="#2d2d2d" stroke-width="40" rx="168" />

  <g transform="translate(262, 312)">
    <!-- Cup Body -->
    <rect x="100" y="50" width="300" height="250" fill="#e2f0cb" stroke="#2d2d2d" stroke-width="30" />
    <!-- Cup Handle -->
    <path d="M 400 100 L 450 100 L 450 200 L 400 200" fill="none" stroke="#2d2d2d" stroke-width="30" stroke-linecap="square" />
    
    <!-- Timer face inside cup -->
    <rect x="150" y="100" width="200" height="100" fill="#2d2d2d" />
    <!-- 25:00 text in pixel style (approximated) -->
    <!-- 2 -->
    <path d="M 170 120 h 30 v 20 h -30 v 20 h 30" fill="none" stroke="#ffb7b2" stroke-width="10" stroke-linecap="square" />
    <!-- 5 -->
    <path d="M 210 120 h -30 v 20 h 30 v 20 h -30" fill="none" stroke="#ffb7b2" stroke-width="10" stroke-linecap="square" />
    <!-- : -->
    <rect x="250" y="130" width="10" height="10" fill="#ffb7b2" />
    <rect x="250" y="150" width="10" height="10" fill="#ffb7b2" />
    <!-- 0 -->
    <rect x="270" y="120" width="30" height="40" fill="none" stroke="#ffb7b2" stroke-width="10" />
    <!-- 0 -->
    <rect x="310" y="120" width="30" height="40" fill="none" stroke="#ffb7b2" stroke-width="10" />

    <!-- Steam (Pixel art style) -->
    <rect x="160" y="-80" width="20" height="40" fill="#2d2d2d" />
    <rect x="180" y="-120" width="20" height="40" fill="#2d2d2d" />
    
    <rect x="240" y="-50" width="20" height="40" fill="#2d2d2d" />
    <rect x="260" y="-90" width="20" height="40" fill="#2d2d2d" />

    <rect x="320" y="-70" width="20" height="40" fill="#2d2d2d" />
    <rect x="340" y="-110" width="20" height="40" fill="#2d2d2d" />

    <!-- Drop shadow -->
    <rect x="130" y="300" width="300" height="30" fill="#2d2d2d" />
  </g>
</svg>
